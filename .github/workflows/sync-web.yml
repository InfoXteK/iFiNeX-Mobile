name: Sync website into the app

# Every night (and when you press "Run workflow") this looks at your website repository. If the website changed, it copies the new
# files into the app, raises the app's patch version (2.1.0 -> 2.1.1), saves that, and starts "Build iFiNeX APK" -> a new Release
# appears -> the app shows "update available". Nothing changed on the website = nothing happens.
on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC = 07:17 Dubai
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  WEB_REPO: SquadSplit/Squadsplit.github.io     # the repository GitHub Pages serves your website from (must be public)
  WEB_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Pull the website and compare
        id: sync
        run: bash tools/sync-web.sh

      - name: Save the new website files
        if: steps.sync.outputs.changed == 'true'
        env:
          NEWVER: ${{ steps.sync.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync website into app -> v$NEWVER [skip ci]"
          git push

      - name: Start the build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
